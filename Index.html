<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Finanças</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --tx:#16201e; --mut:#5f6f6b; --bd:#dde4e2; --pri:#0f766e; --pri-tx:#fff;
  --c1:#2a78d6; --c2:#eb6834; --pos:#0b7a43; --neg:#b42318; --warn:#9a6700; --warn-bg:#fff4d6; --chip:#e8eeec; --bar:#bfe0da;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1514; --card:#162120; --tx:#e7efed; --mut:#93a6a1; --bd:#27393a; --pri:#2dd4bf; --pri-tx:#06211e;
    --c1:#3987e5; --c2:#d95926; --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --warn-bg:#3a2e0a; --chip:#1f2f2e; --bar:#1f4a45;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
#busy{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:g .7s linear infinite;visibility:hidden}
#busy.on{visibility:visible}
@keyframes g{to{transform:rotate(360deg)}}
main{max-width:860px;margin:0 auto;padding:12px 16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:10px 0 8px;font:inherit;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:18px;line-height:1.1;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:150px}
  nav{top:0;right:auto;width:150px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:56px}
  nav button{text-align:left;padding:12px 18px;font-size:14px}
  nav button b{display:inline;margin-right:8px;font-size:16px}
}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=checkbox]{width:auto;min-height:0;transform:scale(1.25);margin-right:8px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.valor{font-size:28px;font-weight:600;text-align:right}
button.pri,button.sec,button.dng{font:inherit;font-weight:600;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer;border:1px solid var(--pri)}
button.pri{background:var(--pri);color:var(--pri-tx)}
button.sec{background:transparent;color:var(--pri)}
button.dng{background:transparent;color:var(--neg);border-color:var(--neg)}
button.pri:disabled{opacity:.5}
button.mini{font:inherit;font-size:13px;padding:6px 10px;min-height:0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.full{width:100%}
.lista .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.lista .it:last-child{border:0}
.it .d{width:44px;color:var(--mut);font-size:13px;flex:none}
.it .m{flex:1;min-width:0}
.it .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .v{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.it .v small{display:block;color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--tx)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--mut);margin-left:6px;vertical-align:middle}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--bar);color:var(--tx)}
.pend{font-style:italic}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat small{color:var(--mut);display:block;font-size:12px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.nav-mes{display:flex;align-items:center;gap:8px;margin:8px 0}
.nav-mes strong{flex:1;text-align:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:var(--card);color:var(--mut);padding:9px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-tx);font-weight:600}
.barra{height:6px;border-radius:3px;background:var(--bar);margin-top:4px}
.barra i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.conf{display:flex;align-items:center;padding-right:4px}
.conf input{margin:0}
.aviso{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.vazio{color:var(--mut);text-align:center;padding:24px 8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media (min-width:700px){#modal{align-items:center}#modal .box{border-radius:16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#16201e;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;display:none;max-width:90vw;font-size:14px}
#toast.err{background:var(--neg)}
.barra i.est{background:var(--neg)}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{fill:var(--mut);font-size:10px}
.chart .grade{stroke:var(--bd);stroke-width:1}
.chart .sel{fill:var(--chip)}
.chart rect.b1{fill:var(--c1)}.chart rect.b2{fill:var(--c2)}
.chart .lin{fill:none;stroke:var(--c1);stroke-width:2}
.chart circle{fill:var(--c1)}
.leg{display:flex;gap:14px;font-size:13px;color:var(--mut);margin:6px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.det{font-size:14px;min-height:20px;margin-top:4px;font-variant-numeric:tabular-nums}
table.tb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.tb th,table.tb td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--bd)}
table.tb th:first-child,table.tb td:first-child{text-align:left}
.acoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acoes>*{flex:1}
.sub{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><h1 id="titulo">Finanças</h1><div id="busy"></div></header>
<main id="view"><div class="vazio">Carregando…</div></main>
<nav id="nav">
  <button data-tab="painel"><b>▦</b>Painel</button>
  <button data-tab="lancar"><b>＋</b>Lançar</button>
  <button data-tab="extrato"><b>≡</b>Extrato</button>
  <button data-tab="resumo"><b>◔</b>Resumo</button>
  <button data-tab="saldos"><b>$</b>Saldos</button>
  <button data-tab="faturas"><b>▭</b>Cartões</button>
  <button data-tab="mais"><b>⋯</b>Mais</button>
</nav>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
const S = { cad: null, hoje: '', recentes: [], recs: [], tab: 'lancar', planilha: '',
  ext: { chave: null, mes: null, soNaoConf: false, dados: null, modo: 'conta' },
  res: { modo: 'mes', ref: null, vis: 'cat' }, mais: 'rec', cache: {}, cons: {}, pn: { tabela: false } };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brl = v => v == null ? '' : v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num2 = v => v == null ? '' : v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dm = iso => iso.slice(8) + '/' + iso.slice(5, 7);
const dmy = iso => iso.slice(8) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesNome = ym => MESES[+ym.slice(5, 7) - 1] + ' de ' + ym.slice(0, 4);
const addMes = (ym, n) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + String(m + 1).padStart(2, '0'); };
const ultDia = ym => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); return ym + '-' + String(d).padStart(2, '0'); };
const num = s => { if (typeof s === 'number') return s; s = String(s || '').trim().replace(/[R$\s]/g, ''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? null : n; };
const ptSort = (a, b) => a.localeCompare(b, 'pt-BR');

let ocupado = 0;
function busy(d) { ocupado += d; $('#busy').classList.toggle('on', ocupado > 0); }
function api(fn, ...args) {
  busy(1);
  return new Promise((ok, err) => google.script.run
    .withSuccessHandler(r => { busy(-1); if (/^api_(salvar|excluir|conferir|registrar|gerar|confirmar|ativar)/.test(fn)) S.cache = {}; ok(r); })
    .withFailureHandler(e => { busy(-1); err(new Error((e && e.message) || String(e))); })[fn](...args));
}
// Mostra na hora o que já foi carregado antes e atualiza em seguida (some o "Carregando").
function swrp(key, fetcher) {
  return { then(cb) {
    const c = S.cache[key]; if (c) cb(c);
    return fetcher().then(d => { S.cache[key] = d; cb(d); });
  } };
}
let tt;
function toast(msg, erro) {
  const t = $('#toast'); t.textContent = msg; t.className = erro ? 'err' : ''; t.style.display = 'block';
  clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', erro ? 6000 : 2500);
}
const falha = e => toast(String(e.message || e).replace(/^Error:\s*/, ''), true);

function abrir(html) { $('#box').innerHTML = html; $('#modal').classList.add('on'); }
function fechar() { $('#modal').classList.remove('on'); $('#box').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fechar(); });
function perguntar(msg, botoes) {
  return new Promise(ok => {
    abrir(`<p>${esc(msg)}</p><div class="acoes">${botoes.map((b, i) => `<button class="${i === 0 ? 'pri' : 'sec'}" data-r="${i}">${esc(b)}</button>`).join('')}</div>`);
    $('#box').onclick = e => { const b = e.target.closest('[data-r]'); if (b) { $('#box').onclick = null; fechar(); ok(+b.dataset.r); } };
  });
}

// ---------- cadastros em memória ----------
const catDe = nome => S.cad.categorias.find(c => c.descricao === nome);
const natDe = nome => { const c = catDe(nome); return c ? S.cad.naturezas.find(n => n.nome === c.natureza) : null; };
const contaDe = chave => S.cad.contas.find(c => c.chave === chave);
function optCats(sel) {
  const g = {};
  S.cad.categorias.forEach(c => { if (c.ativo || c.descricao === sel) (g[c.natureza] = g[c.natureza] || []).push(c); });
  return Object.keys(g).map(n => `<optgroup label="${esc(n)}">${g[n].sort((a, b) => ptSort(a.descricao, b.descricao)).map(c => `<option ${c.descricao === sel ? 'selected' : ''}>${esc(c.descricao)}</option>`).join('')}</optgroup>`).join('');
}
function optContas(sel, vazio, filtro) {
  return (vazio ? '<option value="">—</option>' : '') + S.cad.contas.filter(c => (c.ativo || c.chave === sel) && (!filtro || filtro(c)))
    .map(c => `<option value="${esc(c.chave)}" ${c.chave === sel ? 'selected' : ''}>${esc(c.chave)}</option>`).join('');
}
const ROTULO_DESTINO = { 'Transferência': 'Para a conta', 'Aplicação': 'Aplicado em', 'Resgate': 'Resgatado de', 'Retirada': 'Foi para (ex.: cartão)', 'Depósito': 'Veio de', 'Transitoria': 'Outra conta', 'Compromisso': 'Outra conta' };
function precisaDestino(catNome) {
  const n = natDe(catNome); if (!n) return false;
  return n.efeito === 'neutro';
}
const arPadrao = () => { const x = S.cad.contas.filter(c => c.ativo && c.tipo === 'AR'); return x.length === 1 ? x[0].chave : ''; };
const ehAntecip = cat => cat === 'Antecipação' || cat === 'Devolução antecipação';
function sinalLanc(l) { const n = S.cad.naturezas.find(x => x.nome === l.natureza); return n ? n.sinal : -1; }
function valorLanc(l) { return l.efetivo != null ? l.efetivo : (l.previsto || 0); }

// ---------- navegação ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => ir(b.dataset.tab));
function ir(tab) {
  S.tab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const t = { painel: 'Painel', lancar: 'Lançar', extrato: 'Extrato e conciliação', resumo: 'Resumo', saldos: 'Saldos', faturas: 'Cartões', mais: 'Mais' }[tab];
  $('#titulo').textContent = t;
  ({ painel: vPainel, lancar: vLancar, extrato: vExtrato, resumo: vResumo, saldos: vSaldos, faturas: vFaturas, mais: vMais })[tab]();
}

// =====================================================
// PAINEL
// =====================================================
const M3 = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mes3 = ym => M3[+ym.slice(5, 7) - 1] + '/' + ym.slice(2, 4);
const curto = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : String(Math.round(v));

// Barras agrupadas (uma ou duas séries) em SVG. Toque numa coluna para ver os valores do mês.
function svgBarras(serie, chaves) {
  const W = 360, H = 190, ml = 38, mb = 22, mt = 8, mr = 6, n = serie.length;
  const max = Math.max(1, ...serie.flatMap(m => chaves.map(k => m[k.k])));
  const topo = Math.ceil(max / 1000) * 1000 || 1000, pw = W - ml - mr, ph = H - mt - mb, slot = pw / n, bw = Math.min(11, slot * 0.34);
  const y = v => mt + ph - v / topo * ph;
  let g = '';
  [0, 0.5, 1].forEach(f => { const v = topo * f; g += `<line class="grade" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 4}" y="${y(v) + 3}" text-anchor="end">${curto(v)}</text>`; });
  serie.forEach((m, i) => {
    const cx = ml + slot * i + slot / 2;
    g += `<g data-i="${i}" style="cursor:pointer"><rect class="sel" x="${ml + slot * i}" y="${mt}" width="${slot}" height="${ph}" opacity="0" data-fundo="${i}"/>`;
    chaves.forEach((k, j) => {
      const x = cx - (chaves.length * bw) / 2 + j * bw, h = Math.max(0, m[k.k] / topo * ph);
      g += `<rect class="b${j + 1}" x="${x}" y="${mt + ph - h}" width="${bw - 1}" height="${h}" rx="1.5"/>`;
    });
    g += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${M3[+m.ym.slice(5, 7) - 1]}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function svgLinha(serie) {
  const W = 360, H = 190, ml = 38, mb = 22, mt = 10, mr = 10, n = serie.length;
  const vals = serie.map(p => p.valor), lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  const pad = (hi - lo) * 0.08, mn = lo - (lo < 0 ? pad : 0), mx = hi + pad, pw = W - ml - mr, ph = H - mt - mb;
  const x = i => ml + (n === 1 ? pw / 2 : pw * i / (n - 1)), y = v => mt + ph - (v - mn) / (mx - mn) * ph;
  let g = '';
  [mn, (mn + mx) / 2, mx].forEach(v => { g += `<line class="grade" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml - 4}" y="${y(v) + 3}" text-anchor="end">${curto(v)}</text>`; });
  if (n > 1) g += `<polyline class="lin" points="${serie.map((p, i) => x(i) + ',' + y(p.valor)).join(' ')}"/>`;
  serie.forEach((p, i) => {
    g += `<g data-i="${i}" style="cursor:pointer"><rect x="${x(i) - pw / n / 2}" y="${mt}" width="${pw / n}" height="${ph}" fill="transparent"/><circle cx="${x(i)}" cy="${y(p.valor)}" r="3.5"/>${i % Math.ceil(n / 6) === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 7}" text-anchor="middle">${M3[+p.ym.slice(5, 7) - 1]}</text>` : ''}</g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function tabelaSerie(serie, cols) {
  return `<table class="tb"><tr><th>Mês</th>${cols.map(c => `<th>${c.t}</th>`).join('')}</tr>${serie.map(m => `<tr><td>${mes3(m.ym)}</td>${cols.map(c => `<td>${num2(m[c.k])}</td>`).join('')}</tr>`).join('')}</table>`;
}

function vPainel() {
  $('#view').innerHTML = '<div class="vazio">Carregando…</div>';
  swrp('painel', () => api('api_painel')).then(d => {
    if (S.tab !== 'painel') return;
    const k = d.kpis, P = S.pn, tab = P.tabela;
    const taxa = k.taxaPoupanca3m;
    const eco = taxa == null ? 'neu' : taxa >= 20 ? 'pos' : taxa >= 0 ? 'neu' : 'neg';
    const patrim = d.patrimonio, pr = d.proximos;
    const topMax = Math.max(1, ...d.topDespesas.map(t => Math.max(t.mes, t.media)));
    $('#view').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Resultado de ${MESES[+d.hoje.slice(5, 7) - 1]}</small><b class="${k.resultadoMes >= 0 ? 'pos' : 'neg'}">${brl(k.resultadoMes)}</b><small>receitas ${num2(k.receitasMes)} · despesas ${num2(k.despesasMes)}</small></div>
      <div class="stat"><small>Taxa de poupança (3 meses fechados)</small><b class="${eco}">${taxa == null ? '—' : num2(taxa) + '%'}</b><small>${taxa == null ? 'precisa de 3 meses fechados com receita' : 'quanto da receita sobrou'}</small></div>
      <div class="stat"><small>Reserva de emergência</small><b>${k.reservaMeses == null ? '—' : num2(k.reservaMeses) + ' meses'}</b><small>${k.reservaMeses == null ? 'precisa de 3 meses de despesas lançadas' : 'líquido ' + num2(k.liquido) + ' ÷ média ' + num2(k.despesaMedia)}</small></div>
      <div class="stat"><small>Patrimônio líquido</small><b>${brl(k.patrimonio)}</b>${k.variacaoPatrimonio == null ? '' : `<small class="${k.variacaoPatrimonio >= 0 ? 'pos' : 'neg'}">${k.variacaoPatrimonio >= 0 ? '+' : ''}${num2(k.variacaoPatrimonio)} no mês</small>`}</div>
    </div>
    <div class="card"><h2>Receitas e despesas, mês a mês</h2>
      <div class="leg"><span><i style="background:var(--c1)"></i>Receitas</span><span><i style="background:var(--c2)"></i>Despesas</span></div>
      ${tab ? tabelaSerie(d.serie, [{ k: 'receitas', t: 'Receitas' }, { k: 'despesas', t: 'Despesas' }]) : `<div id="p_g1">${svgBarras(d.serie, [{ k: 'receitas' }, { k: 'despesas' }])}</div><div class="det" id="p_d1">Toque numa coluna para ver os valores.</div>`}
      <p class="sub">Só o que já foi pago. O mês atual ainda está em andamento.</p></div>
    <div class="card"><h2>Patrimônio líquido</h2>
      ${patrim.length < 2 ? '<div class="vazio">Aparece quando houver pelo menos dois meses com saldo registrado.</div>' : (tab ? tabelaSerie(patrim.map(p => ({ ym: p.ym, valor: p.valor })), [{ k: 'valor', t: 'Patrimônio' }]) : `<div id="p_g2">${svgLinha(patrim)}</div><div class="det" id="p_d2">Toque num ponto para ver o valor.</div>`)}
      <p class="sub">Contas, dinheiro, aplicações e valores a receber, menos cartões a pagar. Moeda estrangeira fica de fora. Consórcio pago (${brl(k.compromissoPago)} até hoje) não entra.</p></div>
    <div class="card"><h2>Maiores despesas: este mês e média dos meses anteriores</h2>

        <div class="barra" style="background:none"><i style="width:${t.mes / topMax * 100}%;background:var(--c1)"></i></div><div class="barra" style="background:none;margin-top:2px"><i style="width:${t.media / topMax * 100}%;background:var(--c2)"></i></div></div>`).join('') : '<div class="vazio">Sem despesas pagas ainda.</div>'}</div>

      <div class="lista">${pr.itens.length ? pr.itens.map(i => `<div class="it" style="cursor:default"><div class="d">${dm(i.data)}</div><div class="m"><div>${esc(i.desc)}${i.fatura ? '<span class="tag warn">fatura</span>' : ''}</div><small>${esc(i.categoria)}${i.meio ? ' · ' + esc(i.meio) : ''}</small></div><div class="v ${i.valor >= 0 ? 'pos' : 'neg'}">${num2(i.valor)}</div></div>`).join('') : '<div class="vazio">Nada previsto para os próximos 30 dias. Gere as recorrências do mês em Mais.</div>'}</div></div>

      liga('#p_g2', '#p_d2', i => `<b>${mes3(patrim[i].ym)}</b> · ${brl(patrim[i].valor)}`);

// LANÇAR
// =====================================================
function memo(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function vLancar() {
  S.busca = null;
  const meioPadrao = memo('meio') && contaDe(memo('meio')) ? memo('meio') : (S.cad.contas.find(c => c.ativo && c.classe === 'corrente') || {}).chave;
  const descs = [...new Set(S.recentes.map(l => l.desc))].slice(0, 60);
  $('#view').innerHTML = `
  <div class="card">
    <label>Valor</label>
    <input id="n_valor" class="valor" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <label>Descrição</label>
    <input id="n_desc" list="dl" autocomplete="off" placeholder="Ex.: Mercado">
    <datalist id="dl">${descs.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
    <label>Categoria</label>
    <select id="n_cat">${optCats('')}</select>
    <div class="row">
      <div><label>Conta / meio</label><select id="n_meio">${optContas(meioPadrao)}</select></div>
      <div><label>Data</label><input id="n_data" type="date" value="${S.hoje}"></div>
    </div>
    <div id="n_dest_box" style="display:none"><label id="n_dest_lbl">Conta de destino</label><select id="n_dest">${optContas('', true)}</select></div>
    <label style="display:flex;align-items:center;margin-top:14px;color:var(--tx)"><input type="checkbox" id="n_prev"> Ainda não foi pago (previsto)</label>
    <div class="row" style="margin-top:8px"><div><label>Parcelas</label><input id="n_par" type="number" min="1" max="60" value="1" inputmode="numeric"></div>
      <div id="n_par_box" style="visibility:hidden"><label>O valor informado é</label><select id="n_par_tipo"><option value="parcela">de cada parcela</option><option value="total">do total</option></select></div></div>
    <button class="pri full" id="n_salvar" style="margin-top:12px">Salvar</button>
  </div>
  <h2>Lançamentos</h2>
  <input id="n_busca" type="search" placeholder="Buscar por descrição, categoria ou conta" style="margin-bottom:10px">
  <div class="card lista" id="n_lista"></div>`;
  $('#n_cat').value = memo('cat') && catDe(memo('cat')) ? memo('cat') : $('#n_cat').value;
  atualizaDestino();
  $('#n_cat').onchange = atualizaDestino;
  $('#n_desc').onchange = () => {
    const d = $('#n_desc').value.trim().toLowerCase();
    const l = S.recentes.find(x => x.desc.toLowerCase() === d);
    if (l && catDe(l.categoria)) { $('#n_cat').value = l.categoria; $('#n_meio').value = l.meio; atualizaDestino(); }
  };
  $('#n_salvar').onclick = salvarNovo;
  $('#n_par').oninput = () => { $('#n_par_box').style.visibility = (+$('#n_par').value > 1) ? 'visible' : 'hidden'; };
  let tb; $('#n_busca').oninput = e => {
    clearTimeout(tb); const t = e.target.value.trim();
    if (!t) { S.busca = null; listaRecentes(); return; }
    tb = setTimeout(async () => { try { const r = await api('api_buscar', t); if ($('#n_busca') && $('#n_busca').value.trim() === t) { S.busca = r; listaRecentes(); } } catch (er) { falha(er); } }, 400);
  };
  $('#n_lista').onclick = e => { const it = e.target.closest('[data-id]'); if (it && !it.dataset.id.startsWith('tmp')) editar((S.busca || S.recentes).find(l => l.id === it.dataset.id)); };
  listaRecentes();
}
function atualizaDestino() {
  const cat = $('#n_cat').value, n = natDe(cat), prec = precisaDestino(cat);
  $('#n_dest_box').style.display = prec ? 'block' : 'none';
  if (prec) $('#n_dest_lbl').textContent = ehAntecip(cat) ? (cat === 'Antecipação' ? 'Quem vai devolver' : 'Devolução de quem') + ' (opcional)' : (ROTULO_DESTINO[n.nome] || 'Outra conta') + (n.nome === 'Transferência' ? '' : ' (opcional)');
  if (prec && ehAntecip(cat) && !$('#n_dest').value) $('#n_dest').value = arPadrao();
  else $('#n_dest').value = '';
}
function itemLanc(l) {
  const s = sinalLanc(l), n = S.cad.naturezas.find(x => x.nome === l.natureza), v = valorLanc(l);
  const neutro = !n || n.efeito === 'neutro';
  const cls = neutro ? 'neu' : (s > 0 ? 'pos' : 'neg');
  return `<div class="it" data-id="${esc(l.id)}" style="${l._salvando ? 'opacity:.6' : ''}"><div class="d">${dm(l.data)}</div>
    <div class="m"><div class="${l.efetivo == null ? 'pend' : ''}">${esc(l.desc)}${l._salvando ? '<span class="tag">salvando…</span>' : ''}${l.efetivo == null ? '<span class="tag warn">previsto</span>' : ''}</div>
    <small>${esc(l.categoria)} · ${esc(l.meio)}${l.destino ? ' → ' + esc(l.destino) : ''}</small></div>
    <div class="v ${cls}">${num2(s * v)}</div></div>`;
}
function listaRecentes() {
  const el = $('#n_lista'); if (!el) return;
  const fonte = S.busca || S.recentes;
  el.innerHTML = fonte.length ? fonte.slice(0, S.busca ? 60 : 25).map(itemLanc).join('') : `<div class="vazio">${S.busca ? 'Nada encontrado.' : 'Nada lançado ainda.'}</div>`;
}
async function salvarNovo() {
  const valor = num($('#n_valor').value);
  if (valor == null || valor === 0) { toast('Informe o valor.', true); return; }
  const prev = $('#n_prev').checked;
  const l = { data: $('#n_data').value, desc: $('#n_desc').value, categoria: $('#n_cat').value, meio: $('#n_meio').value, destino: $('#n_dest').value,
    previsto: prev ? valor : null, efetivo: prev ? null : valor };
  const par = Math.floor(+$('#n_par').value || 1);
  if (par > 1) {
    const btn = $('#n_salvar'); btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      const rp = await api('api_salvarParcelado', l, par, { previsto: prev, valorEhTotal: $('#n_par_tipo').value === 'total' });
      rp.lancamentos.forEach(x => { x.natureza = x.natureza || (catDe(x.categoria) || {}).natureza; S.recentes.push(x); });
      S.recentes.sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0);
      memo('meio', l.meio); memo('cat', l.categoria);
      $('#n_valor').value = ''; $('#n_desc').value = ''; $('#n_prev').checked = false; $('#n_par').value = 1; $('#n_par_box').style.visibility = 'hidden';
      toast(par + ' parcelas lançadas'); listaRecentes();
    } catch (e) { falha(e); }
    btn.disabled = false; btn.textContent = 'Salvar';
    return;
  }
  // Lançamento imediato: aparece na lista e o formulário já fica livre; a gravação segue em segundo plano.
  const campos = { v: $('#n_valor').value, d: $('#n_desc').value, p: $('#n_prev').checked };
  const tmp = Object.assign({ id: 'tmp' + Date.now() + Math.random(), natureza: (catDe(l.categoria) || {}).natureza, conferido: false, recId: '', ref: '', _salvando: true }, l,
    { desc: l.desc.trim() || l.categoria });
  S.recentes.unshift(tmp); S.recentes.sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0);
  memo('meio', l.meio); memo('cat', l.categoria);
  $('#n_valor').value = ''; $('#n_desc').value = ''; $('#n_prev').checked = false;
  listaRecentes(); $('#n_valor').focus();
  api('api_salvarLancamento', l, {}).then(r => {
    const sv = r.lancamento; sv.natureza = sv.natureza || (catDe(sv.categoria) || {}).natureza;
    const i = S.recentes.indexOf(tmp); if (i >= 0) S.recentes[i] = sv;
    toast('Lançado'); listaRecentes();
  }).catch(e => {
    S.recentes = S.recentes.filter(x => x !== tmp); listaRecentes(); falha(e);
    if ($('#n_valor') && !$('#n_valor').value) { $('#n_valor').value = campos.v; $('#n_desc').value = campos.d; $('#n_prev').checked = campos.p; }
  });
}

function editar(l, aoSalvar) {
  if (!l) return;
  const p = l.previsto != null ? l.previsto : '', e = l.efetivo != null ? l.efetivo : '';
  abrir(`<h2>Editar lançamento</h2>
    <div class="row"><div><label>Data</label><input id="e_data" type="date" value="${l.data}"></div>
    <div><label>Conta / meio</label><select id="e_meio">${optContas(l.meio)}</select></div></div>
    <label>Descrição</label><input id="e_desc" value="${esc(l.desc)}">
    <label>Categoria</label><select id="e_cat">${optCats(l.categoria)}</select>
    <div id="e_dest_box"><label id="e_dest_lbl">Outra conta</label><select id="e_dest">${optContas(l.destino, true)}</select></div>
    <div class="row"><div><label>Previsto</label><input id="e_prev" inputmode="decimal" value="${p === '' ? '' : num2(p)}"></div>
    <div><label>Efetivo (pago)</label><input id="e_efet" inputmode="decimal" value="${e === '' ? '' : num2(e)}"></div></div>
    <label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="e_conf" ${l.conferido ? 'checked' : ''}> Conferido com o extrato</label>
    ${l.recId ? '<p class="sub">Veio de uma recorrência.</p>' : ''}
    <div class="acoes"><button class="pri" id="e_ok">Salvar</button><button class="sec" id="e_x">Cancelar</button><button class="dng" id="e_del">Excluir</button></div>`);
  const atual = () => {
    const prec = precisaDestino($('#e_cat').value), n = natDe($('#e_cat').value);
    $('#e_dest_box').style.display = prec ? 'block' : 'none';
    if (prec) $('#e_dest_lbl').textContent = ehAntecip($('#e_cat').value) ? 'Quem vai devolver' : (ROTULO_DESTINO[n.nome] || 'Outra conta');
  };
  $('#e_cat').onchange = atual; atual();
  $('#e_x').onclick = fechar;
  $('#e_del').onclick = async () => {
    if (await perguntar('Excluir "' + l.desc + '"?', ['Excluir', 'Cancelar']) !== 0) return;
    try { await api('api_excluirLancamento', l.id); S.recentes = S.recentes.filter(x => x.id !== l.id); toast('Excluído'); fechar(); if (aoSalvar) aoSalvar(); else ir(S.tab); } catch (er) { falha(er); }
  };
  $('#e_ok').onclick = async () => {
    const novo = Object.assign({}, l, { data: $('#e_data').value, meio: $('#e_meio').value, desc: $('#e_desc').value, categoria: $('#e_cat').value,
      destino: precisaDestino($('#e_cat').value) ? $('#e_dest').value : '', previsto: num($('#e_prev').value), efetivo: num($('#e_efet').value), conferido: $('#e_conf').checked });
    let aplicar = false;
    if (l.recId && novo.previsto != null && novo.previsto !== l.previsto) {
      const r = await perguntar('Você mudou o valor previsto de uma recorrência. Vale só para este mês ou também para os próximos?', ['Só este mês', 'Este e os próximos']);
      aplicar = r === 1;
    }
    try {
      const r = await api('api_salvarLancamento', novo, { aplicarFuturas: aplicar });
      const i = S.recentes.findIndex(x => x.id === l.id); if (i >= 0) S.recentes[i] = r.lancamento;
      toast(aplicar ? 'Salvo. ' + r.futuras + ' mês(es) seguinte(s) atualizado(s).' : 'Salvo'); fechar();
      if (aoSalvar) aoSalvar(); else ir(S.tab);
    } catch (er) { falha(er); }
  };
}

// =====================================================
// EXTRATO E CONCILIAÇÃO
// =====================================================
function segExtrato() {
  return `<div class="seg"><button data-xm="conta" class="${S.ext.modo === 'conta' ? 'on' : ''}">Por conta</button><button data-xm="cat" class="${S.ext.modo === 'cat' ? 'on' : ''}">Por categoria</button></div>`;
}
function ligaSegExtrato() { document.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { S.ext.modo = b.dataset.xm; vExtrato(); }); }
function vExtrato() {
  const E = S.ext;
  if (E.modo === 'cat') return vConsulta();
  if (!E.mes) E.mes = S.hoje.slice(0, 7);
  if (!E.chave) E.chave = (S.cad.contas.find(c => c.ativo && c.classe === 'corrente') || S.cad.contas[0]).chave;
  $('#view').innerHTML = segExtrato() + `
  <div class="card">
    <select id="x_conta">${optContas(E.chave)}</select>
    <div class="nav-mes"><button class="mini" id="x_ant">‹</button><strong>${mesNome(E.mes)}</strong><button class="mini" id="x_prox">›</button></div>
  </div>
  <div id="x_corpo"><div class="vazio">Carregando…</div></div>`;
  ligaSegExtrato();
  $('#x_conta').onchange = e => { E.chave = e.target.value; vExtrato(); };
  $('#x_ant').onclick = () => { E.mes = addMes(E.mes, -1); vExtrato(); };
  $('#x_prox').onclick = () => { E.mes = addMes(E.mes, 1); vExtrato(); };
  const meuMes = E.mes, minhaConta = E.chave;
  swrp('x|' + E.chave + '|' + E.mes, () => api('api_extrato', E.chave, E.mes + '-01', ultDia(E.mes))).then(d => {
    if (S.tab !== 'extrato' || E.mes !== meuMes || E.chave !== minhaConta) return;
    E.dados = d; desenhaExtrato();
  }).catch(falha);
}
function desenhaExtrato() {
  const E = S.ext, d = E.dados, cartao = d.conta.classe === 'cartao';
  const linhas = d.linhas.filter(l => !E.soNaoConf || !l.conferido);
  const rot = cartao ? { ab: 'Fatura anterior', fi: 'Fatura no fim' } : { ab: 'Saldo inicial', fi: 'Saldo final' };
  const fim = ultDia(E.mes), dtPadrao = fim < S.hoje ? fim : S.hoje;
  $('#x_corpo').innerHTML = `
  <div class="stats">
    <div class="stat"><small>${rot.ab}</small><b>${brl(d.abertura)}</b></div>
    <div class="stat"><small>Entradas</small><b class="pos">${brl(d.entradas)}</b></div>
    <div class="stat"><small>Saídas</small><b class="neg">${brl(d.saidas)}</b></div>
    <div class="stat"><small>${rot.fi}</small><b>${brl(d.fechamentoReal)}</b>${d.fechamentoComPrevistos !== d.fechamentoReal ? `<small>com previstos: ${brl(d.fechamentoComPrevistos)}</small>` : ''}</div>
  </div>
  ${d.previstosEmAtraso ? `<div class="aviso">${d.previstosEmAtraso} previsto(s) de meses anteriores ainda sem valor pago. Eles não entram no saldo.</div>` : ''}
  <label style="display:flex;align-items:center;color:var(--tx);margin:4px 0 8px"><input type="checkbox" id="x_nc" ${E.soNaoConf ? 'checked' : ''}> Mostrar só o que não está conferido (${d.naoConferidos})</label>
  <div class="card lista" id="x_lista">${linhas.length ? linhas.map(l => `
    <div class="it" data-id="${esc(l.id)}"><div class="conf"><input type="checkbox" data-conf="${esc(l.id)}" ${l.conferido ? 'checked' : ''}></div>
      <div class="d">${dm(l.data)}</div>
      <div class="m"><div class="${l.pendente ? 'pend' : ''}">${esc(l.desc)}${l.pendente ? '<span class="tag warn">previsto</span>' : ''}</div><small>${esc(l.categoria)}${l.destino && l.destino !== d.conta.chave ? ' → ' + esc(l.destino) : ''}${l.meio !== d.conta.chave ? ' ← ' + esc(l.meio) : ''}</small></div>
      <div class="v ${l.valor >= 0 ? 'pos' : 'neg'}">${num2(l.valor)}<small>${num2(l.saldo)}</small></div></div>`).join('') : '<div class="vazio">Sem lançamentos neste período.</div>'}</div>
  <div class="card"><h2>Conferir com o ${cartao ? 'valor da fatura' : 'extrato do banco'}</h2>
    <div class="row"><div><label>Data</label><input type="date" id="c_data" value="${dtPadrao}"></div>
    <div><label>${cartao ? 'Valor da fatura' : 'Saldo no banco'}</label><input id="c_valor" inputmode="decimal" placeholder="0,00"></div></div>
    <button class="pri full" id="c_ok" style="margin-top:12px">Comparar e registrar</button><div id="c_res"></div></div>`;
  $('#x_nc').onchange = e => { E.soNaoConf = e.target.checked; desenhaExtrato(); };
  $('#x_lista').onclick = async e => {
    const cb = e.target.closest('[data-conf]');
    if (cb) {
      const id = cb.dataset.conf, v = cb.checked;
      const ln = d.linhas.find(x => x.id === id); ln.conferido = v; d.naoConferidos += v ? -1 : 1;
      try { await api('api_conferir', [id], v); } catch (er) { falha(er); ln.conferido = !v; cb.checked = !v; }
      return;
    }
    const it = e.target.closest('[data-id]'); if (!it) return;
    const l = d.linhas.find(x => x.id === it.dataset.id);
    editar({ id: l.id, data: l.data, desc: l.desc, categoria: l.categoria, meio: l.meio, natureza: l.natureza, destino: l.destino, previsto: l.previsto, efetivo: l.efetivo, conferido: l.conferido, recId: l.recId, ref: l.ref }, vExtrato);
  };
  $('#c_ok').onclick = () => conferir(false);
}
async function conferir(rendimento) {
  const E = S.ext, cartao = E.dados.conta.classe === 'cartao';
  const valor = num($('#c_valor').value);
  if (valor == null) { toast('Informe o valor.', true); return; }
  try {
    const r = await api('api_registrarSaldo', E.chave, $('#c_data').value, valor, { rendimento: !!rendimento });
    const ap = E.dados.conta.classe === 'aplicacao';
    let h;
    if (r.rendimentoLancado) h = `<div class="aviso" style="background:var(--bar);color:var(--tx)">Rendimento lançado. Saldo registrado: ${brl(r.informado)}.</div>`;
    else if (Math.abs(r.diferenca) < 0.005) h = `<div class="aviso" style="background:var(--bar);color:var(--tx)">Bateu. Saldo registrado: ${brl(r.informado)}.</div>`;
    else h = `<div class="aviso">Diferença de <b>${brl(r.diferenca)}</b> (${cartao ? 'fatura' : 'banco'} ${brl(r.informado)} contra ${brl(r.calculado)} nos lançamentos).
      ${ap ? '<br>Em aplicação, a diferença normalmente é rendimento.<div class="acoes"><button class="pri" id="c_rend">Lançar como rendimento</button></div>' : '<br>Marque o que já conferiu e veja o que sobrou sem conferir.'}</div>`;
    $('#c_res').innerHTML = h;
    if ($('#c_rend')) $('#c_rend').onclick = () => conferir(true);
    if (r.rendimentoLancado) setTimeout(vExtrato, 900);
  } catch (e) { falha(e); }
}

// CONSULTA POR CATEGORIA E PERÍODO
// =====================================================
function aplicaPreset(C, p) {
  const ref = S.hoje.slice(0, 7), ano = S.hoje.slice(0, 4);
  C.preset = p;
  if (p === 'mes') { C.ini = ref + '-01'; C.fim = ultDia(ref); }
  else if (p === 'mesant') { const m = addMes(ref, -1); C.ini = m + '-01'; C.fim = ultDia(m); }
  else if (p === '3m') { C.ini = addMes(ref, -2) + '-01'; C.fim = ultDia(ref); }

  else if (p === 'anoant') { const a = String(+ano - 1); C.ini = a + '-01-01'; C.fim = a + '-12-31'; }
}

async function rodaConsulta() {
  const C = S.cons, minha = JSON.stringify(C);

    const d = await api('api_consultar', { ini: C.ini, fim: C.fim, categoria: C.categoria, natureza: C.natureza, conta: C.conta, texto: C.texto, status: C.status, grupo: C.grupo || '' });

function periodoResumo() {
  const R = S.res;

  if (R.modo === 'ano') return [R.ref.slice(0, 4) + '-01-01', R.ref.slice(0, 4) + '-12-31', R.ref.slice(0, 4)];
  const ini = addMes(R.ref, -11); return [ini + '-01', ultDia(R.ref), '12 meses até ' + mesNome(R.ref)];
}

      };

        ${comGrupo ? `<div class="seg" style="margin:0 0 6px"><button data-vis="cat" class="${R.vis === 'cat' ? 'on' : ''}">Por categoria</button><button data-vis="grupo" class="${R.vis === 'grupo' ? 'on' : ''}">Por grupo</button></div>` : ''}
        ${itens.length ? itens.map(linha).join('') : '<div class="vazio">Nada neste período.</div>'}</div>`;
    };
    const rend = d.rendimentos, temRend = rend.realizado || rend.projetado;

    $('#r_corpo').innerHTML = `

      ${bloco('Receitas', d.receitas, 'pos', 'Receita', false)}${bloco('Despesas', d.despesas, 'neg', 'Despesa', true)}
      ${d.fora.length ? `<div class="card"><h2>Fora do resultado</h2>${d.fora.map(f => `<div style="display:flex;justify-content:space-between;gap:8px;margin:8px 0"><span>${esc(rotFora[f.natureza] || f.natureza)}</span><span style="font-variant-numeric:tabular-nums">${num2(f.realizado)}</span></div>`).join('')}

          <small>fecha ${dm(f.fechamento)} · vence ${dm(f.vencimento)} · ${f.itens} compra(s)${f.pago ? ' · pago ' + num2(f.pago) : ''}${f.status === 'paga em parte' ? ' · falta ' + num2(f.restante) : ''}${f.divergente ? ' · agendado ' + num2(f.agendado) : ''}</small></div>

      if (ok) {
        e.stopPropagation(); const [id, prev, data] = ok.dataset.ok.split('|');
        abrir(`<h2>Confirmar pagamento da fatura</h2><div class="row"><div><label>Data</label><input type="date" id="o_data" value="${data}"></div><div><label>Valor pago</label><input id="o_val" inputmode="decimal" value="${num2(+prev)}"></div></div>
          <p class="sub">Isso baixa o valor da conta corrente na data informada.</p><div class="acoes"><button class="pri" id="o_ok">Confirmar</button><button class="sec" onclick="fechar()">Cancelar</button></div>`);
        $('#o_ok').onclick = async () => { try { await api('api_confirmarPagamento', id, num($('#o_val').value), $('#o_data').value); fechar(); toast('Pagamento confirmado'); vFaturas(); } catch (er) { falha(er); } };
        return;
      }
      if (rm) {
        e.stopPropagation();
        if (await perguntar('Remover o pagamento agendado desta fatura?', ['Remover', 'Cancelar']) !== 0) return;
        try { await api('api_excluirLancamento', rm.dataset.rm); toast('Removido'); vFaturas(); } catch (er) { falha(er); }
        return;
      }
      const pg = e.target.closest('[data-pg]');
      if (pg) {
        e.stopPropagation(); const [ch, id] = pg.dataset.pg.split('|');
        try { const o = await api('api_gerarPagamentoFatura', ch, id); toast('Pagamento previsto para ' + dm(o.data) + ' em ' + o.meio); vFaturas(); } catch (er) { falha(er); }
        return;
      }
      const it = e.target.closest('[data-it]'); if (!it) return;
      const [ch, id] = it.dataset.it.split('|');
      try {
        const itens = await api('api_itensFatura', ch, id);
        abrir(`<h2>Fatura ${id.slice(5)}/${id.slice(0, 4)} · ${esc(ch)}</h2><div class="lista">${itens.map(i => `<div class="it" style="cursor:default"><div class="d">${dm(i.data)}</div><div class="m"><div>${esc(i.desc)}</div><small>${esc(i.categoria)} · ${esc(i.meio)}</small></div><div class="v">${num2(i.valor)}</div></div>`).join('') || '<div class="vazio">Sem itens.</div>'}</div><div class="acoes"><button class="sec" onclick="fechar()">Fechar</button></div>`);
      } catch (er) { falha(er); }
    };
  }).catch(falha);
}

// =====================================================
// MAIS: recorrências e cadastros
// =====================================================
function vMais() {
  $('#view').innerHTML = `<div class="seg"><button data-s="rec" class="${S.mais === 'rec' ? 'on' : ''}">Recorrências</button><button data-s="contas" class="${S.mais === 'contas' ? 'on' : ''}">Contas</button><button data-s="cats" class="${S.mais === 'cats' ? 'on' : ''}">Categorias</button><button data-s="orc" class="${S.mais === 'orc' ? 'on' : ''}">Orçamento</button></div><div id="m_corpo"></div>
  <p class="sub" style="text-align:center"><a href="${esc(S.planilha)}" target="_blank" style="color:var(--pri)">Abrir a planilha</a></p>`;
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.mais = b.dataset.s; vMais(); });
  ({ rec: mRec, contas: mContas, cats: mCats, orc: mOrc })[S.mais]();
}
function mRec() {
  const mesAtual = S.hoje.slice(0, 7);
  $('#m_corpo').innerHTML = `
  <div class="card"><h2>Gerar lançamentos do mês</h2>
    <div class="row"><input type="month" id="g_mes" value="${mesAtual}"><button class="pri" id="g_go">Gerar</button></div>
    <p class="sub">Pode rodar mais de uma vez: o que já foi gerado não duplica.</p></div>
  <div class="card lista">${S.recs.length ? S.recs.map(r => `<div class="it" data-r="${esc(r.id)}"><div class="d">dia ${r.dia}</div><div class="m"><div>${esc(r.desc)}${r.ativo ? '' : '<span class="tag">inativa</span>'}</div>
    <small>${esc(r.meio)} · ${esc(r.categoria)} · ${r.n ? r.n + ' mes(es)' : 'sem fim'} desde ${r.inicio.slice(5)}/${r.inicio.slice(0, 4)}</small></div><div class="v">${num2(r.previsto)}</div></div>`).join('') : '<div class="vazio">Nenhuma recorrência.</div>'}</div>
  <button class="sec full" id="r_nova">+ Nova recorrência</button>`;
  $('#g_go').onclick = async () => {
    try {
      const r = await api('api_gerarMes', $('#g_mes').value);
      toast(r.criados + ' criado(s)' + (r.jaExistiam ? ', ' + r.jaExistiam + ' já existiam' : ''));
      const b = await api('api_bootstrap'); S.recentes = b.recentes;
    } catch (e) { falha(e); }
  };
  $('#m_corpo').onclick = e => { const it = e.target.closest('[data-r]'); if (it) formRec(S.recs.find(r => r.id === it.dataset.r)); };
  $('#r_nova').onclick = () => formRec({ id: '', desc: '', meio: '', categoria: '', destino: '', previsto: 0, dia: 5, inicio: mesAtual, n: 0, ativo: true });
}
function formRec(r) {
  abrir(`<h2>${r.id ? 'Editar' : 'Nova'} recorrência</h2>
  <label>Descrição</label><input id="f_desc" value="${esc(r.desc)}">
  <label>Categoria</label><select id="f_cat">${optCats(r.categoria)}</select>
  <label>Conta / meio</label><select id="f_meio">${optContas(r.meio)}</select>
  <div id="f_dbox"><label>Outra conta (opcional)</label><select id="f_dest">${optContas(r.destino, true)}</select></div>
  <div class="row"><div><label>Valor previsto</label><input id="f_val" inputmode="decimal" value="${num2(r.previsto)}"></div><div><label>Dia</label><input id="f_dia" type="number" min="1" max="31" value="${r.dia}"></div></div>
  <div class="row"><div><label>Primeiro mês</label><input id="f_ini" type="month" value="${r.inicio}"></div><div><label>Nº de meses (0 = sem fim)</label><input id="f_n" type="number" min="0" value="${r.n}"></div></div>
  <label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="f_ativo" ${r.ativo ? 'checked' : ''}> Ativa</label>
  <div class="acoes"><button class="pri" id="f_ok">Salvar</button><button class="sec" id="f_x">Cancelar</button>${r.id ? '<button class="dng" id="f_del">Excluir</button>' : ''}</div>`);
  const vis = () => $('#f_dbox').style.display = precisaDestino($('#f_cat').value) ? 'block' : 'none';
  $('#f_cat').onchange = vis; vis();
  $('#f_x').onclick = fechar;
  if (r.id) $('#f_del').onclick = async () => {
    if (await perguntar('Excluir a recorrência? Os lançamentos já gerados continuam.', ['Excluir', 'Cancelar']) !== 0) return;
    try { await api('api_excluirRecorrencia', r.id); S.recs = S.recs.filter(x => x.id !== r.id); fechar(); mRec(); } catch (e) { falha(e); }
  };
  $('#f_ok').onclick = async () => {
    try {
      const o = await api('api_salvarRecorrencia', { id: r.id, desc: $('#f_desc').value, meio: $('#f_meio').value, categoria: $('#f_cat').value,
        destino: precisaDestino($('#f_cat').value) ? $('#f_dest').value : '', previsto: num($('#f_val').value) || 0, dia: $('#f_dia').value, inicio: $('#f_ini').value, n: $('#f_n').value, ativo: $('#f_ativo').checked });
      const i = S.recs.findIndex(x => x.id === o.id); if (i >= 0) S.recs[i] = o; else S.recs.push(o);
      fechar(); toast('Salvo'); mRec();
    } catch (e) { falha(e); }
  };
}
function mOrc() {
  $('#m_corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  swrp('orc', () => api('api_orcamento')).then(lista => {
    if (S.tab !== 'mais' || S.mais !== 'orc') return;
    const grupos = {}; lista.forEach(x => (grupos[x.grupo] = grupos[x.grupo] || []).push(x));
    const tot = lista.reduce((t, x) => t + x.orcado, 0), med = lista.reduce((t, x) => t + x.media, 0);
    $('#m_corpo').innerHTML = `<div class="card"><p class="sub" style="margin:0">Quanto você quer gastar por mês em cada categoria. Em branco, a categoria fica sem meta. A média é dos últimos 12 meses fechados.</p>
      <div class="stats" style="margin:10px 0 0"><div class="stat"><small>Orçado por mês</small><b id="o_tot">${brl(tot)}</b></div><div class="stat"><small>Média real por mês</small><b>${brl(med)}</b></div></div></div>
      ${Object.keys(grupos).sort(ptSort).map(g => `<h2>${esc(g)}</h2><div class="card">${grupos[g].sort((a, b) => ptSort(a.categoria, b.categoria)).map(x => `<div class="row" style="align-items:center;margin:8px 0"><div style="flex:1.4"><div>${esc(x.categoria)}</div><small class="sub">média ${num2(x.media)}</small></div><input data-oc="${esc(x.categoria)}" data-md="${x.media}" inputmode="decimal" placeholder="—" value="${x.orcado ? num2(x.orcado) : ''}" style="text-align:right"></div>`).join('')}</div>`).join('')}
      <div class="acoes"><button class="sec" id="o_med">Preencher vazios com a média</button><button class="pri" id="o_ok">Salvar orçamento</button></div>`;
    const soma = () => { let t = 0; document.querySelectorAll('[data-oc]').forEach(i => t += num(i.value) || 0); $('#o_tot').textContent = brl(t); };
    $('#m_corpo').oninput = soma;
    $('#o_med').onclick = () => { document.querySelectorAll('[data-oc]').forEach(i => { if (!i.value && +i.dataset.md > 0) i.value = num2(Math.round(+i.dataset.md)); }); soma(); };
    $('#o_ok').onclick = async () => {
      const itens = [...document.querySelectorAll('[data-oc]')].map(i => ({ categoria: i.dataset.oc, orcado: num(i.value) })).filter(x => x.orcado > 0);
      try { const n = await api('api_salvarOrcamento', itens); toast(n + ' categoria(s) com orçamento'); } catch (e) { falha(e); }
    };
  }).catch(falha);
}
async function recarregaCad() { S.cad = await api('api_cadastros'); }
function mContas() {
  $('#m_corpo').innerHTML = `<div class="card lista">${S.cad.contas.map(c => `<div class="it" data-c="${esc(c.chave)}"><div class="m"><div>${esc(c.chave)}${c.ativo ? '' : '<span class="tag">inativa</span>'}</div><small>${c.classe}${c.faturaDe ? ' · fatura junto com ' + esc(c.faturaDe) : ''}${c.diaFech ? ' · fecha ' + c.diaFech + ' vence ' + c.diaVenc : ''}</small></div><div class="v">${c.saldoInicial != null ? num2(c.saldoInicial) : ''}</div></div>`).join('')}</div>
  <button class="sec full" id="c_nova">+ Nova conta</button>`;
  $('#m_corpo').onclick = e => { const it = e.target.closest('[data-c]'); if (it) formConta(contaDe(it.dataset.c)); };
  $('#c_nova').onclick = () => formConta({ chave: '', nome: '', tipo: '', ativo: true, classe: '' });
}
function formConta(c) {
  const novo = !c.chave, cartao = c.classe === 'cartao';
  abrir(`<h2>${novo ? 'Nova conta' : esc(c.chave)}</h2>
  ${novo ? `<div class="row"><div><label>Tipo (código)</label><input id="k_tipo" placeholder="CC, CV, AP..."></div><div><label>Nome</label><input id="k_nome"></div></div>` : ''}
  <div class="row"><div><label>Saldo inicial</label><input id="k_si" inputmode="decimal" value="${c.saldoInicial != null ? num2(c.saldoInicial) : ''}"></div><div><label>Na data</label><input id="k_dsi" type="date" value="${c.dataSaldoInicial || ''}"></div></div>
  <p class="sub">Vale só até o primeiro saldo informado pelo banco. Depois disso o app parte do último saldo registrado.</p>
  ${cartao || novo ? `<div class="row"><div><label>Dia de fechamento</label><input id="k_fe" type="number" min="1" max="31" value="${c.diaFech || ''}"></div><div><label>Dia de vencimento</label><input id="k_ve" type="number" min="1" max="31" value="${c.diaVenc || ''}"></div></div>
  <label>Conta que paga a fatura</label><select id="k_pg">${optContas(c.contaPgto, true, x => x.classe !== 'cartao')}</select>
  <label>Cartão adicional de (fatura junto com)</label><select id="k_fd">${optContas(c.faturaDe, true, x => x.classe === 'cartao' && x.chave !== c.chave)}</select>` : ''}
  <label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="k_at" ${c.ativo ? 'checked' : ''}> Ativa</label>
  <div class="acoes"><button class="pri" id="k_ok">Salvar</button><button class="sec" id="k_x">Cancelar</button></div>`);
  $('#k_x').onclick = fechar;
  $('#k_ok').onclick = async () => {
    const g = id => $(id) ? $(id).value : '';
    try {
      await api('api_salvarConta', { chave: c.chave, nome: novo ? g('#k_nome') : c.nome, tipo: novo ? g('#k_tipo') : c.tipo, classe: c.classe,
        ativo: $('#k_at').checked, saldoInicial: num(g('#k_si')), dataSaldoInicial: g('#k_dsi'), faturaDe: g('#k_fd') || (novo ? '' : c.faturaDe),
        diaFech: g('#k_fe') || c.diaFech || '', diaVenc: g('#k_ve') || c.diaVenc || '', contaPgto: $('#k_pg') ? g('#k_pg') : c.contaPgto });
      await recarregaCad(); fechar(); toast('Salvo'); mContas();
    } catch (e) { falha(e); }
  };
}
function mCats() {
  const g = {}; S.cad.categorias.forEach(c => (g[c.natureza] = g[c.natureza] || []).push(c));
  $('#m_corpo').innerHTML = Object.keys(g).map(n => `<h2>${esc(n)}</h2><div class="card lista">${g[n].sort((a, b) => ptSort(a.descricao, b.descricao)).map(c => `<div class="it" data-k="${esc(c.descricao)}"><div class="m"><div>${esc(c.descricao)}${c.ativo ? '' : '<span class="tag">inativa</span>'}</div>${c.grupo ? `<small>${esc(c.grupo)}</small>` : ''}</div></div>`).join('')}</div>`).join('') +
    '<button class="sec full" id="k_nova">+ Nova categoria</button>';
  $('#m_corpo').onclick = e => { const it = e.target.closest('[data-k]'); if (it) formCat(catDe(it.dataset.k)); };
  $('#k_nova').onclick = () => formCat({ descricao: '', natureza: 'Despesa', ativo: true });
}
function formCat(c) {
  const novo = !c.descricao;
  abrir(`<h2>${novo ? 'Nova categoria' : esc(c.descricao)}</h2>
  ${novo ? '<label>Nome</label><input id="t_nome">' : ''}
  <label>Natureza</label><select id="t_nat">${S.cad.naturezas.map(n => `<option ${n.nome === c.natureza ? 'selected' : ''}>${esc(n.nome)}</option>`).join('')}</select>
  <label>Grupo (para somar categorias parecidas)</label><input id="t_gr" list="t_grl" value="${esc(c.grupo || '')}" placeholder="Ex.: Moradia"><datalist id="t_grl">${[...new Set(S.cad.categorias.map(x => x.grupo).filter(Boolean))].map(g => `<option value="${esc(g)}">`).join('')}</datalist>
  <p class="sub">Mudar a natureza vale para lançamentos novos. O histórico guarda a natureza que tinha na época.</p>
  <label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="t_at" ${c.ativo ? 'checked' : ''}> Ativa</label>
  <div class="acoes"><button class="pri" id="t_ok">Salvar</button><button class="sec" id="t_x">Cancelar</button></div>`);
  $('#t_x').onclick = fechar;
  $('#t_ok').onclick = async () => {
    try { await api('api_salvarCategoria', { descricao: novo ? $('#t_nome').value : c.descricao, natureza: $('#t_nat').value, grupo: $('#t_gr').value, ativo: $('#t_at').checked }); await recarregaCad(); fechar(); toast('Salvo'); mCats(); }
    catch (e) { falha(e); }
  };
}

// ---------- início ----------
function aplicaBoot(b) {
  S.cad = { contas: b.contas, categorias: b.categorias, naturezas: b.naturezas };
  S.hoje = b.hoje; S.recentes = b.recentes; S.recs = b.recorrencias; S.planilha = b.planilha;
}
let cacheado = false;
try { const c = JSON.parse(localStorage.getItem('boot') || 'null'); if (c && c.contas) { aplicaBoot(c); cacheado = true; ir('lancar'); } } catch (e) {}
api('api_bootstrap').then(b => {
  try { localStorage.setItem('boot', JSON.stringify(b)); } catch (e) {}
  aplicaBoot(b);
  if (!cacheado) ir('lancar');
  else if (S.tab === 'lancar') listaRecentes();
}).catch(e => { if (!cacheado) $('#view').innerHTML = '<div class="aviso">Não consegui carregar: ' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
